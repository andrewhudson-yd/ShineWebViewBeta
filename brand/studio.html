<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand studio</title>
<style>
  :root { --bg: #f6f6f3; --fg: #15181c; --muted: #6a7077; --line: #e3e3de; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111417; --fg: #eceef0; --muted: #9aa1a8; --line: #2a2f35; --card: #181c20; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 28px 24px 8px; max-width: 1080px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; } header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 1080px; margin: 0 auto; padding: 16px 24px 48px; display: grid; gap: 18px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  h2 { margin: 0 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-end; }
  figure { margin: 0; text-align: center; } figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
  canvas { display: block; }
  .phone { width: 180px; border-radius: 22px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { appearance: none; border: 0; border-radius: 10px; padding: 12px 18px; font: inherit; font-weight: 600; background: #15181c; color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { background: #eceef0; color: #111417; } }
  button[disabled] { opacity: .5; cursor: default; }
  #log { font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; color: var(--muted); max-height: 220px; overflow: auto; margin: 12px 0 0; }
  .scrub { width: 180px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Brand studio</h1>
  <p>Previews from <code>brand/brand.json</code> and <code>brand/mark.svg</code>. Edit those, reload, then generate.</p>
</header>
<main>
  <section><h2>App icon</h2><div class="row" id="icons"></div></section>
  <section><h2>Intro video &amp; splash</h2>
    <div class="row">
      <figure><canvas id="video" class="phone" width="1080" height="1920"></canvas><figcaption><input class="scrub" type="range" id="scrub" min="0" max="3000" value="3000" aria-label="Video time"> <span id="t">3.0s</span></figcaption></figure>
      <figure><canvas id="splash" class="phone" width="1080" height="1920"></canvas><figcaption>Launch image</figcaption></figure>
    </div>
  </section>
  <section><h2>Generate</h2>
    <div class="actions"><button id="go">Generate everything</button><span id="status"></span></div>
    <pre id="log"></pre>
  </section>
</main>
<script>
const SANS = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const clamp = t => Math.min(Math.max(t, 0), 1);
const ease = t => 1 - Math.pow(1 - clamp(t), 3);
const back = t => { t = clamp(t); const c = 1.5; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const seg = (t, a, b, f = ease) => f((t - a) / (b - a));
let B, MARK;

const color = v => (v && B.colors[v]) || v || '#000000';
function textOn(hex) { const n = parseInt(hex.slice(1), 16); return (0.2126 * (n >> 16) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255 < 0.55 ? '#ffffff' : color('dark'); }
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c + 255 * amt)));
  return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function bg(x, w, h, hex) {
  const g = x.createLinearGradient(0, 0, w * 0.6, h); g.addColorStop(0, shade(hex, 0.05)); g.addColorStop(1, shade(hex, -0.03));
  x.fillStyle = g; x.fillRect(0, 0, w, h);
}
function drawMark(x, cx, cy, size, alpha = 1) {
  x.save(); x.globalAlpha = alpha; x.drawImage(MARK, cx - size / 2, cy - size / 2, size, size); x.restore();
}

function betaBadge(x, w, adaptive) {
  if (!B.icon.beta) return;
  x.save();
  const unit = adaptive ? w * 0.667 : w, offset = (w-unit)/2;
  const bw=unit*0.43, bh=unit*0.18, bx=offset+unit*0.49, by=offset+unit*0.69;
  x.fillStyle='#fbbf24'; x.strokeStyle='#ffffff'; x.lineWidth=unit*0.015;
  x.beginPath(); x.roundRect(bx,by,bw,bh,unit*0.045); x.fill(); x.stroke();
  x.fillStyle='#351040'; x.font='bold '+unit*0.115+'px Arial'; x.textAlign='center'; x.textBaseline='middle';
  x.fillText('BETA',bx+bw/2,by+bh/2+unit*0.006); x.restore();
}
function icon(w, kind) {
  const c = canvas(w, w), x = c.getContext('2d'), base = color(B.icon.background), scale = B.icon.markScale || 0.66;
  if (kind === 'foreground') { drawMark(x, w / 2, w / 2, w * 0.667 * scale); betaBadge(x, w, true); return c; }
  if (kind === 'silhouette') {
    // Single-colour notification icon: the mark's light parts become white, dark details become see-through.
    drawMark(x, w / 2, w / 2, w * 1.3);
    const img = x.getImageData(0, 0, w, w), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const lum = (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
      d[i + 3] = Math.round(d[i + 3] * clamp((lum - 0.18) / 0.15));
      d[i] = d[i + 1] = d[i + 2] = 255;
    }
    x.putImageData(img, 0, 0); return c;
  }
  x.save();
  if (kind === 'round') { x.beginPath(); x.arc(w / 2, w / 2, w / 2, 0, Math.PI * 2); x.clip(); }
  if (kind === 'square') { x.beginPath(); x.roundRect(0, 0, w, w, w * 0.22); x.clip(); }
  bg(x, w, w, base); x.restore();
  drawMark(x, w / 2, w / 2, w * (kind === 'maskable' ? scale * 0.8 : scale));
  betaBadge(x, w, false);
  return c;
}

function splash(w, h) {
  const c = canvas(w, h), x = c.getContext('2d'); bg(x, w, h, color(B.splash.background));
  drawMark(x, w / 2, h / 2, Math.min(w, h) * 0.46); return c;
}

/** Intro video frame, 1080x1920: mark pops in, a soft pulse, then name + tagline. Ends on a still frame. */
function frame(x, ms) {
  const t = ms / 1000, W = 1080, H = 1920, cx = W / 2, cy = H * 0.43;
  bg(x, W, H, color(B.splash.background));
  const glow = x.createRadialGradient(cx, cy, 0, cx, cy, 720), p = color('primary');
  const rgb = [1, 3, 5].map(i => parseInt(p.slice(i, i + 2), 16)).join(',');
  glow.addColorStop(0, `rgba(${rgb},${0.22 * seg(t, 0.2, 1.4)})`); glow.addColorStop(1, `rgba(${rgb},0)`);
  x.fillStyle = glow; x.fillRect(0, 0, W, H);
  // pulse rings, like a voice
  for (const start of [0.75, 1.05]) {
    const k = clamp((t - start) / 0.9); if (k <= 0 || k >= 1) continue;
    x.strokeStyle = `rgba(${rgb},${0.45 * (1 - k)})`; x.lineWidth = 6; x.beginPath(); x.arc(cx, cy, 230 + 260 * ease(k), 0, Math.PI * 2); x.stroke();
  }
  const pop = seg(t, 0.05, 0.75, back), lift = seg(t, 1.2, 1.9);
  const size = 700 * Math.max(pop, 0.001), y = cy - 70 * lift;
  x.save(); x.shadowColor = textOn(color(B.splash.background)) === '#ffffff' ? 'rgba(0,0,0,.35)' : 'rgba(15,40,60,.12)'; x.shadowBlur = 50; x.shadowOffsetY = 20; drawMark(x, cx, y, size, seg(t, 0.05, 0.35)); x.restore();
  const wm = seg(t, 1.4, 2.1), tg = seg(t, 1.8, 2.5);
  x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.globalAlpha = wm; x.fillStyle = textOn(color(B.splash.background));
  // brand.json "wordmark": { "style": "spaced" } = light, widely spaced capitals (like M A K E R F I E L D)
  const spaced = B.wordmark && B.wordmark.style === 'spaced';
  x.font = spaced ? `300 84px ${SANS}` : `800 108px ${SANS}`; x.letterSpacing = spaced ? '0.42em' : '0px';
  x.fillText(spaced ? B.name.toUpperCase() : B.name, cx + (spaced ? 18 : 0), y + 380 + 36 * (1 - wm)); x.letterSpacing = '0px';
  x.globalAlpha = tg * 0.85; x.fillStyle = color('primaryLight'); x.font = `500 46px ${SANS}`; x.fillText(B.tagline || '', cx, y + 460 + 28 * (1 - tg));
  x.globalAlpha = 1;
}

async function makeVideo() {
  if (!window.Mp4Muxer) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js'; s.onload = res; s.onerror = () => rej(new Error('Could not load mp4-muxer (needs internet)')); document.head.appendChild(s); });
  const FPS = 30, END = 2900, TOTAL = Math.round(END / 1000 * FPS) + 9, c = canvas(1080, 1920), x = c.getContext('2d');
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: 1080, height: 1920 }, fastStart: 'in-memory' });
  let err = null; const enc = new VideoEncoder({ output: (ch, m) => muxer.addVideoChunk(ch, m), error: e => err = e });
  enc.configure({ codec: 'avc1.640028', width: 1080, height: 1920, bitrate: 4_000_000, framerate: FPS, avc: { format: 'avc' } });
  for (let i = 0; i < TOTAL; i++) {
    frame(x, Math.min(i / FPS * 1000, END));
    const vf = new VideoFrame(c, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(vf, { keyFrame: i % 30 === 0 }); vf.close();
    if (enc.encodeQueueSize > 10) await new Promise(r => setTimeout(r, 0));
  }
  await enc.flush(); muxer.finalize();
  if (err) throw err;
  return muxer.target.buffer;
}

const toPng = c => new Promise(r => c.toBlob(r, 'image/png'));
const log = m => { document.getElementById('log').textContent += m + '\n'; };
async function save(p, body, extra = '') {
  const r = await fetch('/save?p=' + encodeURIComponent(p) + extra, { method: 'POST', body });
  if (!r.ok) throw new Error(p + ': ' + await r.text());
}

async function generate() {
  const btn = document.getElementById('go'), status = document.getElementById('status');
  btn.disabled = true; document.getElementById('log').textContent = '';
  try {
    const targets = await (await fetch('/targets')).json(), base = color(B.icon.background);
    for (const t of targets) {
      const [w, h] = t.size;
      const c = t.kind === 'splash' ? splash(w, h) : icon(w, t.kind);
      await save(t.path, await toPng(c), (t.opaque ? '&opaque=1' : '') + '&bg=' + encodeURIComponent(base));
      log('✓ ' + t.path + ' (' + w + '×' + h + ')');
    }
    await fetch('/copy-mark', { method: 'POST' }); log('✓ brand/out/web/mark.svg');
    status.textContent = 'Encoding intro video…';
    await save('resources/splash.mp4', await makeVideo()); log('✓ resources/splash.mp4');
    status.textContent = 'Done — now run: npm run sync';
  } catch (e) { status.textContent = 'Failed: ' + e.message; log('✗ ' + e.message); }
  btn.disabled = false;
}
window.generate = generate;

async function boot() {
  B = await (await fetch('/brand.json')).json();
  MARK = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = '/mark.svg?' + Date.now(); });
  document.getElementById('title').textContent = 'Brand studio — ' + B.name;
  const row = document.getElementById('icons');
  for (const [kind, label] of [['square', 'Android / iPhone'], ['round', 'Round launcher'], ['full', 'App Store'], ['silhouette', 'Notification']]) {
    const fig = document.createElement('figure'), c = icon(kind === 'silhouette' ? 96 : 192, kind);
    c.style.width = '96px'; c.style.height = '96px';
    if (kind === 'silhouette') { c.style.background = '#555'; c.style.borderRadius = '12px'; }
    fig.appendChild(c); fig.insertAdjacentHTML('beforeend', '<figcaption>' + label + '</figcaption>'); row.appendChild(fig);
  }
  const small = document.createElement('figure'), s = icon(96, 'square'); s.style.width = '40px'; s.style.height = '40px';
  small.appendChild(s); small.insertAdjacentHTML('beforeend', '<figcaption>At 40px</figcaption>'); row.appendChild(small);
  const v = document.getElementById('video').getContext('2d'), scrub = document.getElementById('scrub');
  const draw = () => { frame(v, +scrub.value); document.getElementById('t').textContent = (scrub.value / 1000).toFixed(1) + 's'; };
  if (new URLSearchParams(location.search).has('betaIcons')) {
    for (const t of await (await fetch('/targets')).json()) {
      if (t.kind === 'splash' || t.kind === 'silhouette') continue;
      await save(t.path, await toPng(icon(t.size[0],t.kind)),(t.opaque?'&opaque=1':'')+'&bg=%23ffffff');
    }
    document.title='BETA ICONS COMPLETE';
  }
  scrub.addEventListener('input', draw); draw();
  document.getElementById('splash').getContext('2d').drawImage(splash(1080, 1920), 0, 0);
  document.getElementById('go').addEventListener('click', generate);
}
boot();
</script>
</body>
</html>
