<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Offline</title>
  <style>
    :root { --bg: #ffffff; --fg: #111827; --muted: #6b7280; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0f17; --fg: #f3f4f6; --muted: #9ca3af; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none; user-select: none; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 32px calc(24px + env(safe-area-inset-bottom)); text-align: center; }
    svg { width: 72px; height: 72px; color: var(--muted); margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 28px; color: var(--muted); max-width: 320px; }
    button { appearance: none; border: 0; border-radius: 999px; padding: 14px 32px; font: inherit; font-weight: 600;
      background: var(--accent); color: #fff; min-width: 180px; }
    button:active { opacity: .8; transform: scale(.98); }
    button[disabled] { opacity: .6; }
    .links { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; width: 100%; max-width: 320px; }
    .links:empty { display: none; }
    .links p { margin: 0 0 2px; font-size: 13px; color: var(--muted); }
    .links a { display: block; padding: 13px 18px; border-radius: 14px; border: 1.5px solid var(--accent); color: var(--fg);
      text-decoration: none; font-weight: 600; }
    .links a:active { opacity: .75; }
    .status { margin-top: 16px; font-size: 13px; color: var(--muted); min-height: 20px; }
  </style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.6a10 10 0 0 1 9.5-2.4"/><path d="M8.5 16.3a5 5 0 0 1 4-1.3"/>
    <circle cx="12" cy="20" r="1"/><path d="M3 3l18 18"/>
  </svg>
  <h1 id="title">You're offline</h1>
  <p id="message">Check your internet connection. We'll reconnect automatically when you're back online.</p>
  <button id="retry" type="button">Try again</button>
  <div class="status" id="status" role="status"></div>
  <nav class="links" id="links" aria-label="Works offline"></nav>
</main>
<script>
(function () {
  var P = (window.Capacitor && window.Capacitor.Plugins) || {};
  var shell = P.NativeShell, net = P.Network;
  var haptic = function (type) { if (shell) shell.haptic({ type: type }).catch(function () {}); };
  var btn = document.getElementById('retry'), status = document.getElementById('status');
  var retrying = false;

  if (P.SplashScreen) P.SplashScreen.hide();

  // Match the app's colours (light or dark theme).
  if (shell) shell.getConfig().then(function (c) {
    var root = document.documentElement.style;
    if (c.accentColor) root.setProperty('--accent', c.accentColor);
    var m = /^#?([0-9a-f]{6})$/i.exec(c.backgroundColor || '');
    if (!m) return;
    var n = parseInt(m[1], 16), lum = (0.2126 * (n >> 16) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
    root.setProperty('--bg', '#' + m[1]);
    root.setProperty('--fg', lum < 0.5 ? '#f3f4f6' : '#111827');
    root.setProperty('--muted', lum < 0.5 ? '#9ca3af' : '#6b7280');
  }).catch(function () {});

  function retry(auto) {
    if (retrying) return;
    retrying = true;
    btn.disabled = true;
    status.textContent = 'Reconnecting…';
    if (!auto) haptic('light');
    var go = function () { if (shell) shell.retry(); else history.back(); };
    if (!net) return go();
    net.getStatus().then(function (s) {
      if (s.connected) return go();
      retrying = false;
      btn.disabled = false;
      status.textContent = 'Still no connection.';
      if (!auto) haptic('error');
    }).catch(go);
  }

  // Loaded for any failed page load; if we are actually online, say so.
  if (net) net.getStatus().then(function (s) {
    if (!s.connected) return;
    document.getElementById('title').textContent = "Couldn't load this page";
    document.getElementById('message').textContent = 'The server may be busy or unreachable. Please try again in a moment.';
  }).catch(function () {});

  // Bundled pages that keep working without signal (offline.links in app.config.json).
  var boot = window.__NATIVE_SHELL__ || {}, linkList = boot.offlineLinks || [];
  if (linkList.length) {
    var nav = document.getElementById('links');
    var intro = document.createElement('p'); intro.textContent = 'These still work without signal:'; nav.appendChild(intro);
    linkList.forEach(function (l) {
      if (!l || !l.path || l.path.charAt(0) !== '/') return;
      var a = document.createElement('a'); a.href = l.path; a.textContent = l.title || l.path; nav.appendChild(a);
    });
  }

  btn.addEventListener('click', function () { retry(false); });
  if (net) net.addListener('networkStatusChange', function (s) { if (s.connected) retry(true); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) retry(true); });
})();
</script>
</body>
</html>
